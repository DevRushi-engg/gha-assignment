name: Q2 Release Note

on: 
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu.22.04]
        node: [18,20]
        exclude:
          - os: ubuntu.22.04
            node: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          
      - name: Print version
        run: |
          node -v
          npm -v
      - name: Write Report
        run: |
          mkdir -p out
          echo "Runner OS: $Runner_OS">out/report-${{ matrix.os }}-${{ matrix.node }}.txt
      
