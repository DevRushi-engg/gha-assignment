name: Matrix-Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-22.04]
        node: [18, 20]
        exclude:
          - os: ubuntu-22.04
            node: 18
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Print the Node and npm versions
        run: |
          node --version
          npm --version

      - name: Write file out/report-<os>-<node>.txt
        run: |
          mkdir -p out
          echo "Runner OS: ${{ runner.os }}" > out/report-${{ matrix.os }}-${{ matrix.node }}.txt
          echo "Node version: ${{ matrix.node }}" >> out/report-${{ matrix.os }}-${{ matrix.node }}.txt
          echo "Run number: ${{ github.run_number }}" >> out/report-${{ matrix.os }}-${{ matrix.node }}.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ matrix.os }}-${{ matrix.node }}
          path: out/report-${{ matrix.os }}-${{ matrix.node }}.txt

  collect:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      - name: Print contents of every file
        run: |
          echo "=== Printing downloaded artifacts ==="
          find all-artifacts -type f -exec echo -e "\n--- File: {} ---" \; -exec cat {} \;
